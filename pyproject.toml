[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-solution"
version = "0.1.0"
description = "LangGraph-based agent for algorithm solution confirmation and knowledge retrieval."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "langchain-core>=0.3",
  "langgraph>=0.2",
  "langgraph-checkpoint-sqlite>=2.0",
  "numpy>=1.26",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
cli = ["langgraph-cli[inmem]>=0.3"]

[project.scripts]
agent-solution = "agent_solution.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_solution = ["knowledge_base/seeds/*.md", "prompts/*.md"]
